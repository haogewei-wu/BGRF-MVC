[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgrfmvc"
version = "2.0.1"
description = "Boundary-aware granular relation fusion for multi-view clustering"
requires-python = ">=3.7"
dependencies = [
  "numpy>=1.15",
  "h5py>=2.10",
  "pandas>=0.23",
  "PyYAML>=3.13",
  "scipy>=1.1",
  "scikit-learn>=0.19",
]

[project.optional-dependencies]
test = ["pytest>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
